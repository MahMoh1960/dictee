<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dictée vocale FR / AR</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1f2328;--mut:#6b7280;--ac:#1d4ed8;--rec:#dc2626;--bd:#e2e0d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--card:#1e2126;--tx:#e7e9ec;--mut:#9aa1ab;--ac:#6ea0ff;--bd:#2d3239}}
:root[data-theme="dark"]{--bg:#15171a;--card:#1e2126;--tx:#e7e9ec;--mut:#9aa1ab;--ac:#6ea0ff;--bd:#2d3239}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:1.3rem;margin:0 0 4px}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px}
#share{display:none!important}
.ic{display:flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;border-radius:50%}
p.sub{margin:0 0 16px;color:var(--mut);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
select{flex:1;min-width:0}
button{cursor:pointer}
#mic{width:100%;margin:14px 0;padding:16px;font-size:1.05rem;font-weight:600;background:var(--ac);color:#fff;border:0}
#mic.on{background:var(--rec);animation:p 1.2s infinite}
@keyframes p{50%{opacity:.75}}
textarea{width:100%;min-height:240px;resize:vertical;font:inherit;font-size:1.1rem;line-height:1.6;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
#interim{min-height:1.5em;color:var(--mut);font-style:italic;margin:8px 2px}
#msg{color:var(--rec);font-size:.9rem;margin:8px 2px;min-height:1.2em}
</style>
</head>
<body>
<main>
<div class="head"><h1>Dictée vocale</h1>
<button id="share" class="ic" aria-label="Copier le lien de l'application" title="Copier le lien"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button></div>
<p class="sub">Parlez en français ou en arabe : le texte s'écrit automatiquement.</p>
<div class="card">
  <div class="row">
    <select id="lang" aria-label="Langue">
      <option value="fr-FR">Français</option>
      <option value="ar-MA">العربية (المغرب)</option>
      <option value="ar-SA">العربية (فصحى)</option>
    </select>
  </div>
  <button id="mic">🎤 Démarrer la dictée</button>
  <textarea id="txt" dir="auto" placeholder="Le texte dicté apparaîtra ici…"></textarea>
  <div id="interim" dir="auto"></div>
  <div id="msg"></div>
  <div class="row">
    <button id="copy">Copier</button>
    <button id="dl">Télécharger .txt</button>
    <button id="clr">Effacer</button>
  </div>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const mic=$('mic'),txt=$('txt'),itm=$('interim'),msg=$('msg'),lang=$('lang');
let rec=null,listening=false;

function setMsg(t){msg.textContent=t||''}
function addText(t){
  t=t.trim(); if(!t) return;
  const v=txt.value;
  txt.value=v+(v&&!/\s$/.test(v)?' ':'')+t;
  txt.scrollTop=txt.scrollHeight;
}
function build(){
  rec=new SR();
  rec.lang=lang.value;
  rec.continuous=true;
  rec.interimResults=true;
  rec.onresult=e=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal) addText(r[0].transcript); else interim+=r[0].transcript;
    }
    itm.textContent=interim;
  };
  rec.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      setMsg("Accès au microphone refusé. Autorisez-le dans les réglages du navigateur.");
      stop();
    }else if(e.error==='no-speech'||e.error==='aborted'){/* relance auto */}
    else if(e.error==='language-not-supported'){setMsg("Langue non prise en charge par ce navigateur.");stop();}
    else setMsg("Erreur : "+e.error);
  };
  rec.onend=()=>{
    itm.textContent='';
    if(listening){try{rec.start()}catch(_){}}
  };
}
function start(){
  setMsg('');
  build();
  try{rec.start();listening=true;mic.classList.add('on');mic.textContent='⏹ Arrêter la dictée';}
  catch(e){setMsg("Impossible de démarrer : "+e.message)}
}
function stop(){
  listening=false;
  mic.classList.remove('on');mic.textContent='🎤 Démarrer la dictée';
  if(rec){try{rec.stop()}catch(_){}}
  itm.textContent='';
}
if(!SR){
  mic.disabled=true;
  setMsg("La reconnaissance vocale n'est pas disponible ici. Utilisez Google Chrome (Android ou ordinateur) ou Safari récent.");
}
mic.onclick=()=>listening?stop():start();
lang.onchange=()=>{
  txt.dir='auto';
  if(listening){stop();setTimeout(start,300)}
};
$('copy').onclick=async()=>{
  try{await navigator.clipboard.writeText(txt.value);setMsg('');$('copy').textContent='Copié ✓';}
  catch(_){txt.select();document.execCommand('copy');$('copy').textContent='Copié ✓';}
  setTimeout(()=>$('copy').textContent='Copier',1500);
};
$('dl').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(["\ufeff"+txt.value],{type:'text/plain;charset=utf-8'}));
  a.download='dictee.txt';a.click();
};
$('share').onclick=async()=>{
  const url=location.href;
  try{await navigator.clipboard.writeText(url);setMsg('');flash('Lien copié ✓');}
  catch(_){
    if(navigator.share){try{await navigator.share({title:document.title,url});}catch(_){}}
    else{window.prompt('Copiez le lien :',url);}
  }
};
function flash(t){const b=$('share');b.textContent=t;b.style.width='auto';b.style.borderRadius='10px';b.style.padding='0 12px';b.style.fontSize='.85rem';
  setTimeout(()=>{location.reload===0;b.removeAttribute('style');b.innerHTML=ICON;},1600);}
const ICON=$('share').innerHTML;
$('clr').onclick=()=>{txt.value='';itm.textContent='';setMsg('')};
</script>
</body>
</html>
